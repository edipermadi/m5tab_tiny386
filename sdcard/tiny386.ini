; tiny386 on the M5Stack Tab5: copy this file to the root of the microSD card
; (FAT32; disk images must stay under 4 GB), with the BIOS images and a disk image.
; bios.bin / vgabios.bin: SeaBIOS builds from https://github.com/hchunhui/tiny386/releases

[esp]
; USB host on the USB-A port (mouse, USB keyboard). 0 = off.
enable_usb = 1

[pc]
; /sdcard is the root directory of the SD card. A name without a leading '/'
; is read from the flash partition of that name instead (see partitions.csv).
bios = /sdcard/bios.bin
vga_bios = /sdcard/vgabios.bin
; Guest RAM and VGA RAM come out of a 24 MB PSRAM pool (menuconfig:
; "PSRAM pool for the emulator"), which also holds the 1.8 MB frame buffer.
mem_size = 16M
vga_mem_size = 2M
; fdX hdX cdX
hda = /sdcard/win95.img
; fixes "MS-DOS compatibility mode" in Win9x, but breaks Windows NT
fill_cmos = 1

[display]
; fixed by the firmware to the panel: 1280x720
width = 1280
height = 720

[cpu]
gen = 4
fpu = 0
