dependencies:
  espressif/esp_hosted:
    component_hash: 22b08509494d4465f0e2f91ee16973d76fe90d5a930fa3910b7a43615db001bf
    dependencies:
    - name: cherry-embedded/cherryusb
      registry_url: https://components.espressif.com
      require: private
      rules:
      - if: target in [esp32p4]
      - if: $CONFIG{ESP_HOSTED_HOST_USB_CHERRYUSB_MANIFEST} == 1
      version: '>=1.6.0'
    - name: espressif/esp_tinyusb
      registry_url: https://components.espressif.com
      require: private
      rules:
      - if: target in [esp32s2, esp32s3, esp32s31]
      - if: $CONFIG{ESP_HOSTED_CP_TINYUSB_MANIFEST} == 1
      version: '*'
    - name: espressif/iot_usbh_rndis
      registry_url: https://components.espressif.com
      require: private
      rules:
      - if: target in [esp32p4]
      - if: $CONFIG{ESP_HOSTED_HOST_USB_RNDIS_MANIFEST} == 1
      version: ^0.5.2
    - name: espressif/usb_host_cdc_acm
      registry_url: https://components.espressif.com
      require: private
      rules:
      - if: target in [esp32p4]
      - if: $CONFIG{ESP_HOSTED_HOST_USB_CDC_ACM_MANIFEST} == 1
      version: '*'
    - name: idf
      require: private
      version: '>=5.5'
    source:
      registry_url: https://components.espressif.com/
      type: service
    targets:
    - esp32
    - esp32s2
    - esp32s3
    - esp32s31
    - esp32c2
    - esp32c3
    - esp32c5
    - esp32c6
    - esp32c61
    - esp32h2
    - esp32h4
    - esp32h21
    - esp32p4
    version: 3.1.0
  espressif/usb:
    component_hash: 4f00ced5663505a368bafcb9bb6b2e4a5033cc5625b8f510755a75baadf4ff1d
    dependencies:
    - name: idf
      require: private
      version: '>=5.4'
    source:
      registry_url: https://components.espressif.com
      type: service
    targets:
    - esp32s2
    - esp32s3
    - esp32s31
    - esp32p4
    - esp32h4
    - linux
    version: 1.4.0
  espressif/usb_host_hid:
    component_hash: a6c5366f9b6d80b0d5f56d085d62941464512e0968b96c5877e76a80fcc23f13
    dependencies:
    - name: idf
      require: private
      version: '>=5.0'
    - name: espressif/usb
      registry_url: https://components.espressif.com
      require: public
      rules:
      - if: idf_version >=6.0
      - if: target not in ["linux"]
      version: ^1.0.0
    source:
      registry_url: https://components.espressif.com/
      type: service
    targets:
    - esp32s2
    - esp32s3
    - esp32p4
    - esp32h4
    - esp32s31
    - linux
    version: 1.2.0
  idf:
    source:
      type: idf
    version: 6.1.0
